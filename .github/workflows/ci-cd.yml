name: Build and Push Docker Image

# Sự kiện kích hoạt: Khi có code push lên nhánh 'main'
on:
  push:
    branches: [ "main" ]
  # Cho phép chạy thủ công từ tab Actions trên GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Tải code từ kho lưu trữ về máy ảo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Đăng nhập vào Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Build và Push Docker image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Thay 'yourusername/repository' bằng tên thật của bạn
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demo:latest
